micronaut:
  server:
    # Ephemeral port: several @MicronautTest classes each start their own embedded server, and a fixed
    # port collides ("Address already in use") when one class's server has not fully released the port
    # before the next binds. Port 0 lets the OS pick a free port per server; rest-assured targets the
    # live server automatically, so no test needs to know the concrete port.
    port: 0
    ssl:
      enabled: false

# Keep EhCache disk writes out of /var/lib during tests (not writable without root).
ehcache:
  storage-path: ${java.io.tmpdir}/windsensorbackend-test-ehcache
