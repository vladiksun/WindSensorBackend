micronaut:
  server:
    port: 8080
    ssl:
      enabled: ${SSL_ENABLED:true}
      ssl-redirect: false
      port: 443
      buildSelfSigned: false
      key-store:
        path: ${KEY_STORE_PATH:`classpath:keystore.p12`}
        password: ${KEY_STORE_PASSWORD:changeit}
        type: ${KEY_STORE_TYPE:PKCS12}
        alias: micronaut
  application:
    name: WindSensor
    default-charset: UTF-8
  openapi:
    views:
      spec: swagger-ui.enabled=true
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  security:
    enabled: ${SECURITY_ENABLED:false}
    redirect:
      forbidden:
        enabled: false
      unauthorized:
        enabled: false
  metrics:
    enabled: true

endpoints:
  metrics:
    enabled: true
  loggers:
    enabled: true
    write-sensitive: false

########################################################################################################################

wind-sensor:
  wind-providers:
    windy:
      url: https://api.windyapp.co/apiV9.php?method=getMeteostationDataAndInfo&meteostationID=%s
    neduet:
      url: https://neduet.ru/api/full
    onechip:
      url: https://1chip.ru/windt.php?id=%s
      # 1chip.ru prints sensor-local wall-clock time; pin the sensor's zone so absolute timestamps
      # stay correct regardless of the host/container timezone (e.g. UTC in Docker).
      timezone: Africa/Cairo

  spots-data-url: ${SPOTS_DATA_URL:`https://raw.githubusercontent.com/vladiksun/WindSensorConfig/refs/heads/main/spots.json`}
  spots-test-data-url: ${SPOTS_TEST_DATA_URL:`https://raw.githubusercontent.com/vladiksun/WindSensorConfig/refs/heads/main/spots_test.json`}
  spots-dahab-url: ${SPOTS_DAHAB_URL:`https://raw.githubusercontent.com/vladiksun/WindSensorConfig/refs/heads/main/spots_dahab.json`}
  spots-data-media-type: ${SPOTS_DATA_MEDIA_TYPE:`text/plain`}

########################################################################################################################

# Caching proxy for OpenStreetMap slippy-map tiles (OSM tile usage policy compliance).
# Outbound requests always carry the identifying User-Agent/Referer below; tiles are cached
# locally (EhCache, file-system persistence) honouring upstream Cache-Control/Expires/Etag,
# falling back to min-ttl when those headers are absent or unreadable.
osm-tiles:
  base-url: ${OSM_TILES_BASE_URL:`https://tile.openstreetmap.org`}
  user-agent: "${OSM_TILES_USER_AGENT:`WindSensor/1.0 (+https://github.com/vladiksun/WindSensor; contact: vladiksun@gmail.com)`}"
  referer: ${OSM_TILES_REFERER:`https://github.com/vladiksun/WindSensor`}
  min-ttl: 7d
  # Where the file-system-backed tile cache persists. Deliberately the same value/env var as
  # ehcache.storage-path below so both stay in sync via EHCACHE_STORAGE_PATH.
  ehcache-storage-path: ${EHCACHE_STORAGE_PATH:`/tmp/windsensorbackend/ehcache`}

# EhCache storage engine backing the osm-tiles cache (heap tier keeps hot tiles fast,
# disk tier persists under storage-path so tiles survive container restarts).
ehcache:
  storage-path: ${EHCACHE_STORAGE_PATH:`/tmp/windsensorbackend/ehcache`}
  caches:
    osm-tiles:
      heap:
        max-entries: 100
      disk:
        max-size: 1Gb
    # Composed viewport images are far larger than single tiles (~256 KB vs ~30 KB), so the heap
    # tier holds fewer entries while the disk tier gets more room. Same file-system persistence as
    # osm-tiles so composites also survive container restarts.
    osm-composites:
      heap:
        max-entries: 50
      disk:
        max-size: 2Gb
